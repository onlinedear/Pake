name: Publish Rooter to Release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build run ID to download"
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        run: |
          gh run download "${{ inputs.run_id }}" --repo "${{ github.repository }}" --dir ./out
          find ./out -type f -exec ls -la {} \;
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish to release
        run: |
          DMG=$(find ./out -name '*.dmg' | head -1)
          echo "dmg=$DMG"
          gh release create "rooter-${{ inputs.run_id }}" "$DMG" --repo "${{ github.repository }}" --title "Rooter App" --notes "Built from run ${{ inputs.run_id }} (https://rooter.mcdonalds.cn/ai-chat)" --target master
        env:
          GH_TOKEN: ${{ github.token }}
